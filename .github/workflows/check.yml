name: Check second-edition camera (no deployment)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: camera-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    if: github.repository == 'esaKITs/kana-romaji-camera-kanji'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run deps
      - uses: actions/cache@v4
        with:
          path: .cache
          key: kanji-assets-v1-${{ hashFiles('**/*lock.json', 'pages/runtime.lock.json') }}
      - name: Pinned research compiler
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.99.1
      - run: python3 scripts/prepare-research-assets.py
      - run: npm run prepare:assets
      - run: npm run build
      - run: npm test
      - run: npm run verify:dist
      - name: Actual Chromium OCR and project-path integration
        timeout-minutes: 20
        run: |
          node meikiocr-test/node_modules/playwright/cli.js install --with-deps chromium
          CHROMIUM_PATH=$(node --input-type=module -e "import {chromium} from './meikiocr-test/node_modules/playwright/index.mjs';console.log(chromium.executablePath())") npm run test:browser
          CHROMIUM_PATH=$(node --input-type=module -e "import {chromium} from './meikiocr-test/node_modules/playwright/index.mjs';console.log(chromium.executablePath())") npm run test:textbook
      - name: Canonical PP-OCR actual textbook parity
        timeout-minutes: 15
        run: |
          CHROMIUM_PATH=$(node --input-type=module -e "import {chromium} from './meikiocr-test/node_modules/playwright/index.mjs';console.log(chromium.executablePath())") PPOCR_IMAGE=tests/fixtures/practice-a.png node scripts/ppocr-compare.mjs
      - name: Number-counter pronunciation through both actual OCR engines
        timeout-minutes: 15
        run: |
          CHROMIUM_PATH=$(node --input-type=module -e "import {chromium} from './meikiocr-test/node_modules/playwright/index.mjs';console.log(chromium.executablePath())") node scripts/numeric-counter-browser-test.mjs
      - name: Restore the original five-line sample in Still and Live
        timeout-minutes: 15
        run: |
          CHROMIUM_PATH=$(node --input-type=module -e "import {chromium} from './meikiocr-test/node_modules/playwright/index.mjs';console.log(chromium.executablePath())") node scripts/thin-sample-browser-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: second-edition-test-results
          path: test-results/
